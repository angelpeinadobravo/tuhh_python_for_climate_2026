# Checks every push and pull request; on main it also publishes the webpage to GitHub Pages
# (Settings → Pages → Source: "GitHub Actions" must be enabled once).
name: Tests and webpage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # no-commit-to-branch would fail every run on main
      - run: SKIP=no-commit-to-branch pre-commit run --all-files
      - run: pytest ./tests
      - run: cd docs && make html SPHINXBUILD="python -m sphinx"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
